name: Manga Scraper Daily

on:
  schedule:
    - cron: '0 5 * * *' # Chạy vào 5:00 UTC (12:00 trưa VN) mỗi ngày
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "from ai_helper import analyze_manga_info; print('AI Test Result:', analyze_manga_info('Cuộc phiêu lưu của Romain Kalbris', 'Hector Malot', 'NXB Phụ Nữ'))"
          python main.py

      - name: Commit Database Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json manga_db.json index.html || true
          git add -A
          git commit -m "Auto-update manga database" || echo "No changes to commit"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Đẩy thư mục hiện tại có chứa index.html lên Pages
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
